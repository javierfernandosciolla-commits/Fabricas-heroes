<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábrica de Héroes - Crea tu Aventura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 140, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 140, 0, 0.8); }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        @keyframes unlock-animation {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(-5deg); }
            100% { transform: scale(0.95) rotate(0deg); }
        }
        @keyframes reveal {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse-glow { animation: pulse-glow 2s infinite; }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .hero-text-gradient {
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .spinner {
            border: 4px solid rgba(255, 140, 0, 0.1);
            border-top: 4px solid #ff8c00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .lock-button {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lock-button:hover {
            transform: scale(1.05);
        }
        .unlock-message {
            animation: reveal 0.8s ease;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .power-card {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .power-card.selected {
            border-color: #ff8c00;
            background-color: #fff7ed;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="app"></div>
    <div id="modal" class="modal-overlay"></div>

    <script>
        // Estado de la aplicación
        const app = {
            currentScreen: 'welcome',
            heroData: null,
            story: null,
            generatedImage: null,
            isUnlocked: false,
            userPhone: null,
            apiKey: '', // Configurar en consola si es necesario
            storyCount: 0,
            selectedPower: null,
            selectedGender: 'male',
            coloringImage: null
        };

        // Definición de Superpoderes (Mapping Dual: Masculino/Femenino)
        const superPowers = [
            { id: 'vuelo', name: 'Volar', icon: '🚀' },
            { id: 'fuerza', name: 'Súper Fuerza', icon: '💪' },
            { id: 'velocidad', name: 'Velocidad Relámpago', icon: '⚡' },
            { id: 'animales', name: 'Hablar con Animales', icon: '🐾' },
            { id: 'invisible', name: 'Invisibilidad', icon: '👻' },
            { id: 'hielo', name: 'Control del Hielo', icon: '❄️' },
            { id: 'elastico', name: 'Elasticidad', icon: '🥨' },
            { id: 'teleport', name: 'Teletransportación', icon: '🌀' },
            { id: 'gigante', name: 'Cambio de Tamaño', icon: '📏' },
            { id: 'escudo', name: 'Escudo de Energía', icon: '🛡️' }
        ];

        // Función para obtener la imagen del héroe según el poder y género
        function getHeroImage(powerId, gender = 'male') {
            const genderSuffix = gender === 'female' ? '_f' : '_m';
            return `assets/hero_${powerId}${genderSuffix}.png`;
        }

        // Función para obtener la imagen de colorear sincronizada
        function getColoringImage(powerId, gender = 'male') {
            const genderSuffix = gender === 'female' ? '_f' : '_m';
            return `assets/coloring_${powerId}${genderSuffix}.png`;
        }

        // Códigos de país comunes
        const countryCodes = [
            { code: '+54', country: 'Argentina' },
            { code: '+34', country: 'España' },
            { code: '+52', country: 'México' },
            { code: '+55', country: 'Brasil' },
            { code: '+56', country: 'Chile' },
            { code: '+57', country: 'Colombia' },
            { code: '+51', country: 'Perú' },
            { code: '+58', country: 'Venezuela' },
            { code: '+1', country: 'USA/Canadá' }
        ];

        // Cargar estado guardado
        function loadState() {
            const saved = localStorage.getItem('fabrica-heroes-state');
            if (saved) {
                const state = JSON.parse(saved);
                app.isUnlocked = state.isUnlocked || false;
                app.userPhone = state.userPhone || null;
                app.storyCount = state.storyCount || 0;
            }
        }

        // Guardar estado
        function saveState() {
            localStorage.setItem('fabrica-heroes-state', JSON.stringify({
                isUnlocked: app.isUnlocked,
                userPhone: app.userPhone,
                storyCount: app.storyCount
            }));
        }

        // Generar historia extensa con ChatGPT
        async function generateStoryWithAI(heroData) {
            try {
                const prompt = `Escribe una historia épica y emocionante para niños de MÍNIMO 250 palabras sobre un héroe llamado ${heroData.heroName} de ${heroData.heroAge} años que tiene el superpoder de ${heroData.superpower} y debe enfrentarse a ${heroData.villain}. 

La historia debe tener:
1. Introducción: Presentar al héroe y su mundo
2. Conflicto: Cómo aparece el villano/miedo
3. Desarrollo: La aventura y desafíos
4. Clímax: El momento de mayor tensión
5. Resolución: La victoria y lección aprendida

Tono: Inspirador, aventurero, apropiado para niños pero con profundidad emocional. Usa lenguaje vívido y descriptivo.`;

                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${app.apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-3.5-turbo',
                        messages: [{ role: 'user', content: prompt }],
                        max_tokens: 600,
                        temperature: 0.8
                    })
                });

                if (!response.ok) {
                    return generateStoryTemplate(heroData);
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                return generateStoryTemplate(heroData);
            }
        }

        // Plantilla de historia como fallback
        function generateStoryTemplate(heroData) {
            return `En las montañas del norte, nació ${heroData.heroName}, un/a niño/a de ${heroData.heroAge} años bendecido/a con un don extraordinario: ¡podía ${heroData.superpower}! Durante años, vivió en paz, disfrutando de su infancia en un pueblo tranquilo rodeado de bosques antiguos y ríos cristalinos.

Pero todo cambió cuando ${heroData.villain} llegó a su tierra. Las sombras se oscurecieron, la esperanza se desvaneció y el miedo se apoderó de los corazones de todos. Fue entonces cuando recordaron la profecía antigua: "Cuando la oscuridad llegue, un joven héroe con poderes especiales será quien salve nuestro mundo."

${heroData.heroName} no podía quedarse de brazos cruzados. Aunque era joven, sentía una responsabilidad profunda hacia su gente. Con el poder de ${heroData.superpower}, comenzó su entrenamiento, perfeccionando cada habilidad, cada técnica. Cada día se hacía más fuerte, más valiente, más determinado.

Cuando finalmente se encontró cara a cara con ${heroData.villain}, supo que este era el momento que definiría su vida. La batalla fue épica, llena de giros inesperados y momentos de duda. Pero ${heroData.heroName} recordó por qué estaba allí: por su pueblo, por su familia, por la esperanza.

Con un último esfuerzo sobrehumano, utilizando toda la magia de ${heroData.superpower}, logró vencer a ${heroData.villain}. La luz regresó, la esperanza floreció nuevamente, y ${heroData.heroName} se convirtió en la leyenda viviente del pueblo. Su nombre sería recordado por generaciones como el héroe que salvó su mundo.`;
        }



        // Renderizar pantalla de bienvenida
        function renderWelcome() {
            return `
                <div class="hero-gradient min-h-screen flex items-center justify-center p-4">
                    <div class="text-center max-w-2xl">
                        <div class="mb-8">
                            <h1 class="text-5xl md:text-6xl font-bold text-white mb-4">
                                🦸 Fábrica de Héroes
                            </h1>
                            <p class="text-xl md:text-2xl text-gray-200 mb-8">
                                Convierte a tu hijo/a en el protagonista de su propia película
                            </p>
                        </div>

                        <div class="bg-white rounded-lg shadow-2xl p-8 mb-8">
                            <p class="text-gray-700 text-lg mb-8">
                                Crea historias personalizadas donde tu hijo/a es el héroe. Cada aventura es única, emocionante y memorable.
                            </p>

                            <div class="grid md:grid-cols-3 gap-4 mb-8">
                                <div class="p-4 bg-blue-50 rounded-lg">
                                    <div class="text-3xl mb-2">✨</div>
                                    <h3 class="font-bold text-gray-800 mb-2">Historias Épicas</h3>
                                    <p class="text-sm text-gray-600">Narrativas profesionales con IA</p>
                                </div>
                                <div class="p-4 bg-orange-50 rounded-lg">
                                    <div class="text-3xl mb-2">🎨</div>
                                    <h3 class="font-bold text-gray-800 mb-2">Imágenes Únicas</h3>
                                    <p class="text-sm text-gray-600">Ilustraciones de alta calidad</p>
                                </div>
                                <div class="p-4 bg-green-50 rounded-lg">
                                    <div class="text-3xl mb-2">📖</div>
                                    <h3 class="font-bold text-gray-800 mb-2">PDF Descargable</h3>
                                    <p class="text-sm text-gray-600">Guarda la aventura para siempre</p>
                                </div>
                            </div>

                            <button onclick="app.currentScreen = 'form'; render()" class="bg-gradient-to-r from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 text-white font-bold py-4 px-8 rounded-lg text-lg pulse-glow w-full transition">
                                🚀 Crear Aventura
                            </button>
                        </div>

                        <p class="text-gray-300 text-sm">
                            ✨ Completamente Gratis • Solo requiere registro 📱
                        </p>
                    </div>
                </div>
            `;
        }

        // Renderizar formulario
        function renderForm() {
            const powersHtml = superPowers.map(p => `
                <div onclick="selectPower('${p.id}')" id="power-${p.id}" class="power-card p-3 bg-gray-50 rounded-lg text-center border-2 ${app.selectedPower === p.id ? 'selected' : ''}">
                    <div class="text-2xl mb-1">${p.icon}</div>
                    <div class="text-xs font-bold text-gray-700">${p.name}</div>
                </div>
            `).join('');

            return `
                <div class="hero-gradient min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
                        <h2 class="text-3xl font-bold text-gray-800 mb-6">Crea tu Héroe</h2>
                        
                        <form onsubmit="handleFormSubmit(event)">
                            <div class="mb-4">
                                <label class="block text-gray-700 font-bold mb-2">📝 Nombre del Héroe</label>
                                <input type="text" id="heroName" required placeholder="Ej: Luna" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-orange-400">
                            </div>

                            <div class="mb-4">
                                <label class="block text-gray-700 font-bold mb-2">🎂 Edad del Héroe</label>
                                <input type="number" id="heroAge" required min="3" max="18" placeholder="Ej: 8" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-orange-400">
                            </div>

                            <div class="mb-4">
                                <label class="block text-gray-700 font-bold mb-2">👦👧 Género</label>
                                <div class="flex gap-3">
                                    <button type="button" onclick="selectGender('male')" id="gender-male" class="flex-1 py-2 px-4 rounded-lg border-2 font-bold text-gray-700 hover:border-orange-400 transition" style="border-color: #d1d5db; background-color: #f9fafb;">👦 Héroe</button>
                                    <button type="button" onclick="selectGender('female')" id="gender-female" class="flex-1 py-2 px-4 rounded-lg border-2 font-bold text-gray-700 hover:border-orange-400 transition" style="border-color: #d1d5db; background-color: #f9fafb;">👧 Heroína</button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="block text-gray-700 font-bold mb-2">⚡ Elige tu Superpoder</label>
                                <div class="grid grid-cols-3 gap-2 mb-2">
                                    ${powersHtml}
                                </div>
                                <input type="hidden" id="superpowerId" required>
                            </div>

                            <div class="mb-6">
                                <label class="block text-gray-700 font-bold mb-2">👹 Villano a Vencer</label>
                                <input type="text" id="villain" required placeholder="Ej: dragón de fuego" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-orange-400">
                            </div>

                            <button type="submit" class="w-full bg-gradient-to-r from-orange-400 to-orange-600 hover:from-orange-500 hover:to-orange-700 text-white font-bold py-3 rounded-lg pulse-glow transition">
                                ✨ Generar Mi Aventura
                            </button>
                        </form>

                        <button onclick="app.currentScreen = 'welcome'; render()" class="w-full mt-4 text-gray-600 hover:text-gray-800 font-semibold py-2">
                            ← Volver
                        </button>
                    </div>
                </div>
            `;
        }

        function selectPower(id) {
            app.selectedPower = id;
            document.querySelectorAll('.power-card').forEach(c => c.classList.remove('selected'));
            document.getElementById(`power-${id}`).classList.add('selected');
            document.getElementById('superpowerId').value = id;
        }

        function selectGender(gender) {
            app.selectedGender = gender;
            const maleBtn = document.getElementById('gender-male');
            const femaleBtn = document.getElementById('gender-female');
            if (gender === 'male') {
                maleBtn.style.borderColor = '#ff8c00';
                maleBtn.style.backgroundColor = '#fff7ed';
                femaleBtn.style.borderColor = '#d1d5db';
                femaleBtn.style.backgroundColor = '#f9fafb';
            } else {
                femaleBtn.style.borderColor = '#ff8c00';
                femaleBtn.style.backgroundColor = '#fff7ed';
                maleBtn.style.borderColor = '#d1d5db';
                maleBtn.style.backgroundColor = '#f9fafb';
            }
        }

        // Pantalla de carga
        function renderLoading() {
            return `
                <div class="hero-gradient min-h-screen flex items-center justify-center p-4">
                    <div class="text-center">
                        <div class="spinner mx-auto mb-8"></div>
                        <h2 class="text-3xl font-bold text-white mb-4">Generando tu aventura épica...</h2>
                        <p class="text-gray-200">Esto tomará solo unos segundos</p>
                    </div>
                </div>
            `;
        }

        // Pantalla de resultado con candado
        function renderResult() {
            return `
                <div class="bg-gray-50 min-h-screen py-8 px-4">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-4xl font-bold text-center mb-2 text-gray-800">
                            🦸 ${app.heroData.heroName}, el Héroe
                        </h1>
                        
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 class="text-2xl font-bold text-gray-800 mb-4">Tu Historia</h2>
                            
                            <div class="flex flex-col md:flex-row gap-6 mb-6">
                                <div class="w-full md:w-1/3">
                                    <div class="relative group cursor-pointer" onclick="showRegistrationModal()">
                                        <img src="${app.generatedImage}" alt="Héroe" class="w-full h-auto object-cover rounded-lg shadow-md filter blur-sm">
                                        <div class="absolute inset-0 flex items-center justify-center">
                                            <span class="text-4xl">🔒</span>
                                        </div>
                                    </div>
                                    <p class="text-center text-xs text-gray-500 mt-2">Registrate para ver la imagen</p>
                                </div>
                                
                                <div class="flex-1">
                                    <p class="text-gray-700 leading-relaxed mb-4 line-clamp-6">${app.story.substring(0, 300)}...</p>
                                    <div class="bg-gray-100 p-3 rounded italic text-sm text-gray-600 border-l-4 border-orange-400">
                                        Historia completa bloqueada. Regístrate para leer el final épico.
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-4 pt-4 border-t mb-6">
                                <div>
                                    <p class="text-gray-600 text-sm">Edad</p>
                                    <p class="text-lg font-bold text-gray-800">${app.heroData.heroAge} años</p>
                                </div>
                                <div>
                                    <p class="text-gray-600 text-sm">Superpower</p>
                                    <p class="text-lg font-bold text-gray-800">${app.heroData.superpower}</p>
                                </div>
                            </div>

                            <button onclick="showRegistrationModal()" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-4 rounded-lg transition text-lg shadow-lg">
                                🔓 Desbloquear tu Aventura
                            </button>
                        </div>

                        <button onclick="app.currentScreen = 'form'; render()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg transition">
                            ← Crear otra aventura
                        </button>
                    </div>
                </div>
            `;
        }

        // Pantalla desbloqueada
        function renderUnlocked() {
            return `
                <div class="bg-gray-50 min-h-screen py-8 px-4">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-4xl font-bold text-center mb-2 text-gray-800">
                            🦸 ${app.heroData.heroName}, el Héroe
                        </h1>

                        <div class="bg-yellow-50 border-2 border-yellow-400 rounded-lg p-6 mb-6 text-center unlock-message">
                            <h2 class="text-3xl font-bold text-yellow-600 mb-2">¡¡LISTO!!</h2>
                            <p class="text-gray-700">Tu aventura está desbloqueada. Disfruta de la imagen y descarga tu PDF.</p>
                        </div>

                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <div class="mb-6 w-full">
                                <img src="${app.generatedImage}" alt="Héroe" class="w-full h-auto object-cover rounded-lg shadow-md mb-6">
                            </div>

                            <div class="mb-6 w-full">
                                <p class="text-gray-700 leading-relaxed mb-4 whitespace-pre-line">${app.story}</p>
                            </div>

                            <div class="grid grid-cols-2 gap-4 pt-4 border-t mb-6">
                                <div>
                                    <p class="text-gray-600 text-sm">Edad</p>
                                    <p class="text-lg font-bold text-gray-800">${app.heroData.heroAge} años</p>
                                </div>
                                <div>
                                    <p class="text-gray-600 text-sm">Superpoder</p>
                                    <p class="text-lg font-bold text-gray-800">${app.heroData.superpower}</p>
                                </div>
                            </div>

                            <div class="bg-blue-50 border-2 border-blue-400 rounded-lg p-6 mb-6">
                                <h3 class="text-xl font-bold text-blue-700 mb-4">🚀 ¡Comparte tu Aventura!</h3>
                                <div class="flex flex-col gap-3">
                                    <button onclick="shareOnWhatsApp()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-lg transition">
                                        💬 Compartir en WhatsApp
                                    </button>
                                    <button onclick="handleDownloadPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                                        📥 Descargar PDF de Regalo
                                    </button>
                                </div>
                            </div>

                            <div class="bg-orange-50 border-2 border-orange-400 rounded-lg p-6 text-center">
                                <h3 class="text-xl font-bold text-orange-700 mb-2">💳 Apoya el Proyecto</h3>
                                <p class="text-gray-700 mb-4">Si te gustó, puedes invitarnos un café ($1.000 ARS)</p>
                                <a href="https://mpago.la/2Bx1TBr" target="_blank" class="inline-block w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-lg transition mb-3">
                                    Pagar con MercadoPago
</a>
                                <div class="p-3 bg-white rounded border border-orange-200">
                                    <p class="text-xs text-gray-500 uppercase font-bold">Alias Ualá</p>
                                    <p class="text-lg font-mono font-bold text-gray-800">javiernando.uala</p>
                                </div>
                            </div>
                        </div>

                        <button onclick="app.currentScreen = 'form'; render()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 rounded-lg transition">
                            ← Crear otra aventura
                        </button>
                    </div>
                </div>
            `;
        }

        // Modal de registro
        function showRegistrationModal() {
            const modal = document.getElementById('modal');
            const countriesHtml = countryCodes.map(c => `<option value="${c.code}">${c.country} (${c.code})</option>`).join('');
            
            modal.innerHTML = `
                <div class="bg-white rounded-lg p-8 max-w-sm w-full mx-4 shadow-2xl relative">
                    <h3 class="text-2xl font-bold text-gray-800 mb-4">🔓 Desbloquea tu Historia</h3>
                    <p class="text-gray-600 mb-6">Ingresa tu WhatsApp para recibir el enlace de tu aventura y desbloquear el contenido completo.</p>
                    
                    <form onsubmit="handlePhoneSubmit(event)">
                        <div class="flex gap-2 mb-4">
                            <select id="countryCode" class="w-1/3 px-2 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-orange-400">
                                ${countriesHtml}
                            </select>
                            <input type="tel" id="phoneNumber" required placeholder="Tu número" class="w-2/3 px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-orange-400">
                        </div>
                        <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg transition mb-4">
                            Ver Mi Historia Completa
                        </button>
                    </form>

                    <button onclick="closeModal()" class="w-full text-gray-600 hover:text-gray-800 font-semibold py-2">
                        ✕ Cerrar
                    </button>
                </div>
            `;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function handlePhoneSubmit(event) {
            event.preventDefault();
            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            app.userPhone = `${countryCode}${phoneNumber}`;
            app.isUnlocked = true;
            saveState();
            closeModal();
            app.currentScreen = 'unlocked';
            render();
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const powerId = document.getElementById('superpowerId').value;
            if (!powerId) {
                alert('Por favor, selecciona un superpoder');
                return;
            }
            
            const power = superPowers.find(p => p.id === powerId);
            app.heroData = {
                heroName: document.getElementById('heroName').value,
                heroAge: document.getElementById('heroAge').value,
                superpower: power.name,
                superpowerId: powerId,
                villain: document.getElementById('villain').value,
                gender: app.selectedGender
            };

            app.currentScreen = 'loading';
            render();

            app.story = await generateStoryWithAI(app.heroData);
            app.generatedImage = getHeroImage(powerId, app.selectedGender);
            app.coloringImage = getColoringImage(powerId, app.selectedGender);

            app.currentScreen = 'result';
            app.storyCount++;
            saveState();
            render();
        }

        // Motor de Generación de PDF Data-Driven usando jsPDF (2 Páginas)
        function generateComicSheetPDF() {
            return new Promise((resolve, reject) => {
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4'
                    });

                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const margin = 15;

                    // ========== PÁGINA 1: HÉROE Y HISTORIA ==========
                    // HEADER
                    doc.setFontSize(10);
                    doc.setTextColor(102, 102, 102);
                    doc.text('FÁBRICA DE HÉROES - AVENTURA PERSONALIZADA', pageWidth / 2, margin + 5, { align: 'center' });

                    doc.setFontSize(24);
                    doc.setTextColor(30, 60, 114);
                    doc.setFont(undefined, 'bold');
                    doc.text(`Las Aventuras de ${app.heroData.heroName}`, pageWidth / 2, margin + 18, { align: 'center' });

                    doc.setDrawColor(30, 60, 114);
                    doc.setLineWidth(1);
                    doc.line(margin, margin + 22, pageWidth - margin, margin + 22);

                    // INSERTAR IMAGEN DE HÉROE
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            const imgData = canvas.toDataURL('image/jpeg', 0.95);

                            const maxImgWidth = pageWidth - (margin * 2) - 4;
                            const maxImgHeight = 90;
                            let imgWidth = maxImgWidth;
                            let imgHeight = (img.height / img.width) * imgWidth;

                            if (imgHeight > maxImgHeight) {
                                imgHeight = maxImgHeight;
                                imgWidth = (img.width / img.height) * imgHeight;
                            }

                            const imgX = (pageWidth - imgWidth) / 2;
                            const imgY = margin + 28;

                            doc.setDrawColor(30, 60, 114);
                            doc.setLineWidth(1.5);
                            doc.rect(imgX - 2, imgY - 2, imgWidth + 4, imgHeight + 4);
                            doc.addImage(imgData, 'JPEG', imgX, imgY, imgWidth, imgHeight);

                            // TEXTO
                            const textStartY = imgY + imgHeight + 12;
                            const textWidth = pageWidth - (margin * 2);

                            doc.setFontSize(10);
                            doc.setTextColor(51, 51, 51);
                            doc.setFont(undefined, 'normal');

                            const lines = doc.splitTextToSize(app.story, textWidth);
                            const lineHeight = 5;
                            const maxTextHeight = pageHeight - textStartY - 35;
                            const maxLines = Math.floor(maxTextHeight / lineHeight);
                            const displayLines = lines.slice(0, maxLines);

                            doc.text(displayLines, margin, textStartY, { maxWidth: textWidth, lineHeightFactor: 1.5 });

                            // FOOTER PÁGINA 1
                            const footerY = pageHeight - 25;

                            doc.setDrawColor(255, 140, 0);
                            doc.setLineWidth(0.8);
                            doc.line(margin, footerY - 3, pageWidth - margin, footerY - 3);

                            doc.setFontSize(8);
                            doc.setTextColor(102, 102, 102);
                            doc.setFont(undefined, 'normal');
                            doc.text('Creado con', margin + 5, footerY + 2);
                            doc.setFont(undefined, 'bold');
                            doc.setTextColor(30, 60, 114);
                            doc.text('Fábrica de Héroes', margin + 5, footerY + 8);

                            doc.setDrawColor(255, 140, 0);
                            doc.setLineWidth(1);
                            doc.circle(pageWidth / 2, footerY + 5, 8);
                            doc.setFontSize(14);
                            doc.setTextColor(0, 0, 0);
                            doc.text('🤸', pageWidth / 2, footerY + 6, { align: 'center' });

                            doc.setFontSize(8);
                            doc.setTextColor(102, 102, 102);
                            doc.setFont(undefined, 'normal');
                            doc.text(`Edad: ${app.heroData.heroAge} años`, pageWidth - margin - 35, footerY + 2);
                            doc.text(`Poder: ${app.heroData.superpower}`, pageWidth - margin - 35, footerY + 8);

                            // ========== PÁGINA 2: LIBRO DE COLOREAR ==========
                            doc.addPage();

                            // TÍTULO DE LA PÁGINA 2
                            doc.setFontSize(20);
                            doc.setTextColor(30, 60, 114);
                            doc.setFont(undefined, 'bold');
                            doc.text('¡Tu turno de ser el artista!', pageWidth / 2, margin + 10, { align: 'center' });

                            doc.setDrawColor(255, 140, 0);
                            doc.setLineWidth(1);
                            doc.line(margin, margin + 15, pageWidth - margin, margin + 15);

                            // INSERTAR IMAGEN DE COLOREAR
                            const colorImg = new Image();
                            colorImg.onload = () => {
                                try {
                                    const colorCanvas = document.createElement('canvas');
                                    colorCanvas.width = colorImg.width;
                                    colorCanvas.height = colorImg.height;
                                    const colorCtx = colorCanvas.getContext('2d');
                                    colorCtx.drawImage(colorImg, 0, 0);
                                    const colorImgData = colorCanvas.toDataURL('image/png', 1.0);

                                    // Escalar la imagen de colorear para ocupar la mayor parte de la página
                                    const colorMaxWidth = pageWidth - (margin * 2);
                                    const colorMaxHeight = pageHeight - (margin * 2) - 30;
                                    let colorImgWidth = colorMaxWidth;
                                    let colorImgHeight = (colorImg.height / colorImg.width) * colorImgWidth;

                                    if (colorImgHeight > colorMaxHeight) {
                                        colorImgHeight = colorMaxHeight;
                                        colorImgWidth = (colorImg.width / colorImg.height) * colorImgHeight;
                                    }

                                    const colorImgX = (pageWidth - colorImgWidth) / 2;
                                    const colorImgY = margin + 25;

                                    doc.addImage(colorImgData, 'PNG', colorImgX, colorImgY, colorImgWidth, colorImgHeight);

                                    // FOOTER PÁGINA 2
                                    const footerY2 = pageHeight - 10;
                                    doc.setFontSize(8);
                                    doc.setTextColor(102, 102, 102);
                                    doc.text('Página 2 de 2 - Libro de Colorear', pageWidth / 2, footerY2, { align: 'center' });

                                    doc.save(`${app.heroData.heroName}-aventura.pdf`);
                                    resolve();
                                } catch (err) {
                                    reject(err);
                                }
                            };

                            colorImg.onerror = () => {
                                reject(new Error('No se pudo cargar la imagen de colorear'));
                            };

                            colorImg.src = app.coloringImage;
                        } catch (err) {
                            reject(err);
                        }
                    };

                    img.onerror = () => {
                        reject(new Error('No se pudo cargar la imagen del héroe'));
                    };

                    img.src = app.generatedImage;
                } catch (error) {
                    reject(error);
                }
            });
        }

        // Wrapper para manejar la descarga con feedback
        async function handleDownloadPDF() {
            try {
                const downloadBtn = event.target;
                downloadBtn.disabled = true;
                downloadBtn.textContent = '⏳ Generando PDF...';

                await generateComicSheetPDF();

                downloadBtn.disabled = false;
                downloadBtn.textContent = '📥 Descargar PDF de Regalo';
            } catch (error) {
                console.error('Error en descarga de PDF:', error);
                alert('Hubo un error al generar el PDF. Por favor, intenta de nuevo.');
                event.target.disabled = false;
                event.target.textContent = '📥 Descargar PDF de Regalo';
            }
        }

        function shareOnWhatsApp() {
            const message = encodeURIComponent(`🦸 ¡Mira la aventura de ${app.heroData.heroName}! 🦸\nCon el poder de ${app.heroData.superpower}, enfrenta a ${app.heroData.villain}.\nCrea el tuyo en: ${window.location.href}`);
            window.open(`https://wa.me/?text=${message}`, '_blank');
        }

        function render() {
            const app_div = document.getElementById('app');
            switch(app.currentScreen) {
                case 'welcome': app_div.innerHTML = renderWelcome(); break;
                case 'form': app_div.innerHTML = renderForm(); break;
                case 'loading': app_div.innerHTML = renderLoading(); break;
                case 'result': app_div.innerHTML = renderResult(); break;
                case 'unlocked': app_div.innerHTML = renderUnlocked(); break;
                default: app_div.innerHTML = renderWelcome();
            }
        }

        loadState();
        render();
    </script>
</body>
